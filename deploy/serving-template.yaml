apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: ap-agent-serve-tmpl
  annotations:
    scenarios.ai.sap.com/description: "Agentic AP Automation"
    scenarios.ai.sap.com/name: "agentic-ap-automation"
    executables.ai.sap.com/description: "LangGraph AP agent"
    executables.ai.sap.com/name: "ap-agent-serve"
  labels:
    scenarios.ai.sap.com/id: "agentic-ap-automation"
    ai.sap.com/version: "1.0"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 1
      labels: |
        ai.sap.com/resourcePlan: infer.s
    spec: |
      predictor:
        imagePullSecrets:
        - name: docker-hub-srini117us
        minReplicas: 1
        maxReplicas: 1
        containers:
        - name: kserve-container
          image: docker.io/srini117us/agentic-ap-serve:1.0
          ports:
          - containerPort: 9001
            protocol: TCP
          env:
          - name: DOC_AI_URL
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: DOC_AI_URL}}
          - name: DOC_AI_TOKEN_URL
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: DOC_AI_TOKEN_URL}}
          - name: DOC_AI_CLIENT_ID
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: DOC_AI_CLIENT_ID}}
          - name: DOC_AI_CLIENT_SECRET
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: DOC_AI_CLIENT_SECRET}}
          - name: AI_CORE_URL
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: AI_CORE_URL}}
          - name: AI_CORE_AUTH_URL
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: AI_CORE_AUTH_URL}}
          - name: AI_CORE_CLIENT_ID
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: AI_CORE_CLIENT_ID}}
          - name: AI_CORE_CLIENT_SECRET
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: AI_CORE_CLIENT_SECRET}}
          - name: S4_ODATA_URL
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: S4_ODATA_URL}}
          - name: S4_USER
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: S4_USER}}
          - name: S4_PASSWORD
            valueFrom: {secretKeyRef: {name: ap-agent-creds, key: S4_PASSWORD}}
